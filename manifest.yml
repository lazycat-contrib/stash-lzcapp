name: Stash
package: community.lazycat.app.stash
version: 0.28.1
min_os_version: 1.3.8
description: "一个用 Go 语言编写的组织你的私密内容的工具。"
homepage: https://github.com/stashapp/stash
author: stashapp
application:
  subdomain: stash
  background_task: true
  multi_instance: true

  upstreams:
    - location: /
      backend: http://stash:9999/
services:
  stash:
    # stashapp/stash:v0.28.1
    image: registry.lazycat.cloud/czyt/stashapp/stash:b0b3bfd7364fff9a
    ontainer_name: stash
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    binds:
      - /lzcapp/document/{{.U.media_dir_name_under_your_document}}:/media
      - /lzcapp/var/config:/root/.stash
        ## Point this at your collection.
        ## The left side is where your collection is on your host, the right side is where it will be in stash.
      - /lzcapp/var/data:/data
        ## This is where your stash's metadata lives
      - /lzcapp/var/metadata:/metadata
        ## Any other cache content.
      - /lzcapp/var/cache:/cache
        ## Where to store binary blob data (scene covers, images)
      - /lzcapp/var/blobs:/blobs
        ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /lzcapp/var/generated:/generated

ext_config:
  enable_document_access: true
  enable_media_access: true

locales:
  zh:
    name: "Stash"
    description: "一个用 Go 语言编写的组织你的私密内容的工具"
  en:
    name: "Stash"
    description: "An organizer for your porn, written in Go"
